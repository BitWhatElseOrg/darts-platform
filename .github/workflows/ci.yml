name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://darts:darts@localhost:5432/darts
  REDIS_URL: redis://localhost:6379
  BETTER_AUTH_SECRET: ci-only-better-auth-secret-with-32-characters
  BETTER_AUTH_URL: http://localhost:3001
  WEB_PORT: 3000
  API_PORT: 3001
  WEB_ORIGIN: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1

jobs:
  quality:
    name: Phase 0 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: darts
          POSTGRES_USER: darts
          POSTGRES_PASSWORD: darts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darts -d darts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @darts-platform/web exec playwright install --with-deps chromium

      - name: End-to-end test
        run: pnpm test:e2e

  deployment-artifacts:
    name: Deployment artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API deployment image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web deployment image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.test/api/v1
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build worker deployment image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.worker
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
